    <title>Isoline — five peaks, drawn before they were climbed</title>
    <meta

      content="A hand-drawn contour sketch rises from the page into five snow peaks. Scroll to fly between them at first light."

  <body>
    <div id="loader"></div>
    <canvas id="gl" aria-hidden="true"></canvas>

    <div id="ui">
      <a class="brand" href="#top" aria-label="Isoline, back to the start">
        <svg class="brand__mark" width="26" height="18" viewBox="0 0 26 18" fill="none" aria-hidden="true">
          <path d="M1 17 L9.5 4 L13 9.5 L17 2 L25 17" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round" />
          <path d="M6.5 17 Q13 12.5 19.5 17" stroke="currentColor" stroke-width="1" />
        </svg>
        <span class="brand__word">Isoline</span>
      </a>
      <div id="mode-toggle"></div>

      <section class="hero" aria-labelledby="hero-title">
        <h1 class="hero__name" id="hero-title" aria-label="Isoline">
          <span aria-hidden="true">I</span><span aria-hidden="true">S</span><span aria-hidden="true">O</span><span aria-hidden="true">L</span><span aria-hidden="true">I</span><span aria-hidden="true">N</span><span aria-hidden="true">E</span>
        </h1>
        <p class="hero__deck">Every mountain begins as a line.</p>
        <p class="hero__body">
          Five peaks, surveyed by hand at first light, years before anyone stood on them. One of them still waits.
        </p>
      </section>

      <aside class="legend" aria-label="Map legend">
        <div class="legend__scale">
          <svg width="144" height="14" viewBox="0 0 144 14" fill="none" aria-hidden="true">
            <path d="M0.5 4.5 H143.5 V8.5 H0.5 Z" stroke="currentColor" stroke-width="1" />
            <path d="M36 4.5 H72 V8.5 H36 Z M108 4.5 H143.5 V8.5 H108 Z" fill="currentColor" />

          </svg>
          <div class="legend__ticks"><span>0</span><span>1</span><span>2 km</span></div>
        </div>
        <dl class="legend__facts">
          <div><dt>Scale</dt><dd>1:25 000</dd></div>
          <div><dt>Contour interval</dt><dd>100 m</dd></div>
          <div><dt>Surveyed</dt><dd>05:42–07:40</dd></div>
          <div><dt>Data</dt><dd>Terrain Tiles, ESA WorldCover</dd></div>
        </dl>
      </aside>

      <div class="scroll-hint" aria-hidden="true">
        <svg width="12" height="26" viewBox="0 0 12 26" fill="none">
          <path d="M6 1 C5 9 7 16 6 24 M1.5 19.5 L6 24 L10.5 19.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
        </svg>
        <span>Scroll to raise the sheet</span>
      </div>

      <div id="labels" aria-hidden="true"></div>
      <div id="chapters"></div>
      <div id="panels"></div>
      <section id="endcard"></section>
      <div id="hud"></div>
    </div>

    <main id="track" aria-label="Journey">
      <a id="top"></a>
      <div id="stations"></div>
    </main>
