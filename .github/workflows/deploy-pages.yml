name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Prepare static artifact with Pages base path
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          rm -rf _site
          cp -r site _site
          touch _site/.nojekyll
          if [ -n "$BASE_PATH" ]; then
            python3 -c '
          import os, pathlib
          base = os.environ["BASE_PATH"].rstrip("/")
          root = pathlib.Path("_site")
          for p in [root / "index.html", *root.glob("assets/*.js")]:
              text = p.read_text(encoding="utf-8")
              for prefix in ("/assets/", "/dem/", "/sky/"):
                  for q in ("\"", "\x27", "`"):
                      text = text.replace(q + prefix, q + base + prefix)
              p.write_text(text, encoding="utf-8")
          '
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
